<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Yönetim – Rezervasyonlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600&family=Onest:wght@400;500;600&display=swap">
<style>
  :root { --bg:#fff; --surface-2:#f6f6f4; --ink:#151515; --muted:#5b5b57; --line:#e4e4e0; --accent:#c4161c; --soft:#fdeeee; --ok:#1b7a43; --ok-soft:#e5f4ea;
    --head:Newsreader,Georgia,serif; --body:Onest,system-ui,sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.55 var(--body); -webkit-font-smoothing: antialiased; }
  h1, h2 { font-family: var(--head); font-weight: 500; margin: 0; line-height: 1.1; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: #fff; border: 1px solid var(--ink); padding: .5rem .9rem; border-radius: 0; font-size: .875rem; font-weight: 500; }
  button:hover { background: var(--surface-2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); }
  input { border: 1px solid var(--ink); background: #fff; padding: .6rem .8rem; border-radius: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 1.25rem 3rem; }
  .top { border-bottom: 1px solid var(--ink); }
  .top .wrap { display: flex; justify-content: space-between; align-items: center; gap: 1rem; height: 60px; padding-bottom: 0; }
  .brand { font: 600 1.0625rem var(--head); }
  .brand small { font: 500 .75rem var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-left: .6rem; }
  #login { max-width: 340px; margin: 18vh auto 0; display: grid; gap: .875rem; padding: 0 1.25rem; }
  #login h1 { font-size: 2rem; } #login p { margin: 0; color: var(--muted); }
  #err { color: var(--accent); font-size: .875rem; min-height: 1.3em; }

  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 1rem; padding: 2rem 0 1.25rem; }
  .head h1 { font-size: 2.25rem; }
  .tools { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .tools input { width: 15rem; max-width: 100%; }
  .tools a { text-decoration: none; color: inherit; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border-block: 1px solid var(--ink); margin-bottom: 1.75rem; }
  .stats div { padding: 1rem 0 1rem 1.25rem; } .stats div:first-child { padding-left: 0; }
  .stats div + div { border-left: 1px solid var(--line); }
  .stats dt { font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .stats dd { margin: .125rem 0 0; font: 600 1.75rem var(--head); }

  .days { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .75rem; margin-bottom: 2rem; }
  .day { text-align: left; padding: .875rem 1rem; border: 1px solid var(--line); background: #fff; display: block; width: 100%; }
  .day:hover { border-color: var(--ink); background: #fff; }
  .day.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--soft); }
  .day b { display: block; font: 600 .9375rem var(--body); } .day .n { display: block; font: 600 1.75rem var(--head); margin: .125rem 0; }
  .day small { color: var(--muted); font-size: .8125rem; display: block; }
  .bar { height: 4px; background: var(--line); margin-top: .5rem; } .bar i { display: block; height: 100%; background: var(--accent); }

  .list { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: .5rem .75rem; border-bottom: 1px solid var(--ink); }
  td { padding: .875rem .75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  td small { color: var(--muted); display: block; }
  .code { font: 600 .9375rem ui-monospace, Menlo, monospace; letter-spacing: .06em; }
  .tag { display: inline-block; padding: .125rem .55rem; font-size: .8125rem; font-weight: 600; background: var(--surface-2); }
  .tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.wait { background: var(--soft); color: var(--accent); }
  .act { white-space: nowrap; } .act button { padding: .35rem .65rem; font-size: .8125rem; }
  td a { color: var(--ink); }
  #empty { color: var(--muted); padding: 2rem 0; }

  @media (max-width: 760px) {
    .stats { grid-template-columns: 1fr 1fr; } .stats div:nth-child(3) { padding-left: 0; border-left: 0; } .stats div:nth-child(n+3) { border-top: 1px solid var(--line); }
    table, tbody, tr, td { display: block; } thead { display: none; }
    tr { border: 1px solid var(--line); padding: .5rem .875rem; margin-bottom: .75rem; }
    td { border: 0; padding: .25rem 0; display: flex; justify-content: space-between; gap: 1rem; } td::before { content: attr(data-l); color: var(--muted); font-size: .8125rem; flex: none; }
    .act { justify-content: flex-start; padding-top: .5rem; } .act::before { display: none; }
  }
  @media print { .top, .tools, .days, .act, th:last-child { display: none; } .wrap { padding: 0; } }
</style>
</head>
<body>
<form id="login" hidden>
  <h1>Yönetim girişi</h1>
  <p>Paylaşılan şifreyle giriş yapın.</p>
  <input type="password" id="pw" placeholder="Şifre" autocomplete="current-password" required>
  <button class="primary">Giriş yap</button>
  <div id="err" role="alert"></div>
</form>

<div id="panel" hidden>
  <header class="top"><div class="wrap"><span class="brand">Sevmekten Öldü Desinler!<small>Yönetim</small></span><button id="logout">Çıkış</button></div></header>
  <div class="wrap">
    <div class="head">
      <h1>Rezervasyonlar</h1>
      <div class="tools">
        <input id="q" type="search" placeholder="İsim, telefon veya kod ara">
        <button id="print">Yazdır</button>
        <a href="/api/admin/export.csv"><button type="button">CSV indir</button></a>
      </div>
    </div>
    <dl class="stats" id="stats"></dl>
    <div class="days" id="cards"></div>
    <div class="list"><table>
      <thead><tr><th>Kod</th><th>Tarih</th><th>İsim</th><th>Telefon</th><th>Kişi</th><th>Ödeme</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p id="empty" hidden>Bu görünümde rezervasyon yok.</p>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (d) => new Date(d + 'T12:00:00').toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', weekday: 'short' });
let data, filter = 'all';

async function api(url, opt) {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opt });
  if (r.status === 401 && !url.includes('login')) { show(false); throw new Error('auth'); }
  return r;
}
function show(on) { $('login').hidden = on; $('panel').hidden = !on; }
function el(tag, text, cls) { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; }
const money = (n) => `${n.toLocaleString('tr-TR')}\u00a0${data.price.currency}`;

async function load() {
  const r = await fetch('/api/admin/data');
  if (!r.ok) return show(false);
  data = await r.json(); show(true); render();
}
function render() {
  const S = data.sessions, R = data.reservations;
  const people = S.reduce((a, s) => a + s.people, 0), paid = S.reduce((a, s) => a + s.paidPeople, 0);
  const st = $('stats'); st.replaceChildren();
  [['Rezervasyon', R.length], ['Toplam kişi', people], ['Ödemesi alınan', paid + ' kişi'], ['Tahsil edilen', money(paid * data.price.amount)]]
    .forEach(([k, v]) => { const d = el('div'); d.append(el('dt', k), el('dd', v)); st.append(d); });

  const cards = $('cards'); cards.replaceChildren();
  const mk = (id, title, big, sub, pct) => {
    const c = el('button', null, 'day' + (filter === id ? ' sel' : ''));
    c.type = 'button'; c.append(el('b', title), el('span', big, 'n'), el('small', sub));
    if (pct != null) { const bar = el('div', null, 'bar'), i = document.createElement('i'); i.style.width = Math.min(100, pct) + '%'; bar.append(i); c.append(bar); }
    c.onclick = () => { filter = id; render(); }; cards.append(c);
  };
  mk('all', 'Tüm tarihler', `${people} kişi`, `${R.length} rezervasyon`);
  S.forEach((s) => mk(s.id, `${fmt(s.date)} · ${s.time}`, `${s.people} / ${s.capacity}`, `${s.reservations} rezervasyon · ${s.paidPeople} kişi ödedi`, s.people / s.capacity * 100));

  const q = $('q').value.trim().toLowerCase();
  const sess = Object.fromEntries(S.map((s) => [s.id, s]));
  const rows = R.filter((r) => (filter === 'all' || r.session_id === filter) &&
    (!q || `${r.name} ${r.surname} ${r.phone} ${r.code} ${r.email || ''}`.toLowerCase().includes(q)));
  const tb = $('rows'); tb.replaceChildren(); $('empty').hidden = rows.length > 0;
  rows.forEach((r) => {
    const s = sess[r.session_id], tr = document.createElement('tr');
    const cell = (label, node) => { const td = el('td'); td.dataset.l = label; td.append(node); return td; };
    const who = el('span', `${r.name} ${r.surname}`);
    const whoWrap = document.createElement('span'); whoWrap.append(who);
    if (r.email) whoWrap.append(el('small', r.email));
    if (r.note) whoWrap.append(el('small', '“' + r.note + '”'));
    const a = el('a', r.phone); a.href = 'tel:' + r.phone.replace(/[^+\d]/g, '');
    const pay = el('span', (r.payment_method === 'havale' ? 'Havale' : 'Gişe, nakit') + ' · ' + (r.paid ? 'ödendi' : 'bekliyor'), 'tag ' + (r.paid ? 'ok' : 'wait'));
    const act = el('td', null, 'act');
    const tog = el('button', r.paid ? 'Ödenmedi yap' : 'Ödendi işaretle', r.paid ? '' : 'primary');
    tog.onclick = async () => { await api('/api/admin/reservations/' + r.id, { method: 'PATCH', body: JSON.stringify({ paid: !r.paid }) }); load(); };
    const del = el('button', 'Sil');
    del.onclick = async () => { if (confirm(`${r.name} ${r.surname} rezervasyonu silinsin mi?`)) { await api('/api/admin/reservations/' + r.id, { method: 'DELETE' }); load(); } };
    act.append(tog, ' ', del);
    tr.append(cell('Kod', el('span', r.code, 'code')), cell('Tarih', el('span', s ? `${fmt(s.date)} ${s.time}` : r.session_id)),
      cell('İsim', whoWrap), cell('Telefon', a), cell('Kişi', el('span', r.seats)), cell('Ödeme', pay), act);
    tb.append(tr);
  });
}
$('login').onsubmit = async (e) => {
  e.preventDefault();
  const r = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ password: $('pw').value }) });
  if (r.ok) { $('pw').value = ''; $('err').textContent = ''; load(); } else $('err').textContent = (await r.json()).error;
};
$('logout').onclick = async () => { await fetch('/api/admin/logout', { method: 'POST' }); show(false); };
$('q').oninput = render; $('print').onclick = () => print();
load();
setInterval(() => { if (!$('panel').hidden && document.visibilityState === 'visible') load(); }, 30000);
</script>
</body>
</html>
